<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <meta name="description" content="Cali Ciudad Salsera - novela visual interactiva sobre la cultura salsera de Cali (prototipo academico).">
    <meta name="theme-color" content="#14213D">
    <title>Cali Ciudad Salsera | Explora Cali</title>
    <style>
      :root {
        --ink: #101820;
        --deep: #14213D;
        --gold: #E8A33D;
        --terracotta: #C1440E;
        --cream: #F4E7D3;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #1b2b4d 0%, var(--deep) 45%, #0a1122 100%);
        color: var(--cream);
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #unity-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-container.unity-desktop #unity-canvas {
        background: #0a1122;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
        border-radius: 6px;
      }
      #unity-container.unity-mobile { width: 100%; height: 100%; }
      #unity-canvas { display: block; width: 100%; height: 100%; }
      .unity-mobile #unity-canvas { width: 100% !important; height: 100% !important; border-radius: 0; }

      #unity-loading-bar {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(520px, 82vw); text-align: center;
      }
      #unity-logo {
        width: 84px; height: 84px; margin: 0 auto 18px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%, var(--gold) 0 8px, transparent 9px),
          repeating-radial-gradient(circle at 50% 50%, #1d1d1d 0 4px, #2a2a2a 4px 8px);
        box-shadow: 0 0 0 6px rgba(232, 163, 61, 0.18), 0 10px 30px rgba(0, 0, 0, 0.5);
        animation: spin 6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #unity-logo-title { font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); }
      #unity-logo-subtitle { margin-top: 6px; font-size: 14px; opacity: 0.8; }
      #unity-progress-bar-empty {
        margin: 22px auto 0; height: 12px; border-radius: 8px;
        background: rgba(244, 231, 211, 0.16); overflow: hidden;
      }
      #unity-progress-bar-full { height: 100%; width: 0%; background: linear-gradient(90deg, var(--terracotta), var(--gold)); transition: width 0.15s linear; }
      #unity-loading-hint { margin-top: 12px; font-size: 13px; opacity: 0.65; }

      #unity-warning { position: fixed; top: 0; left: 0; right: 0; z-index: 20; }
      #unity-warning div { color: #101820; font-size: 14px; }

      #unity-footer {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: flex; align-items: center; gap: 14px;
        padding: 10px 16px; font-size: 12px;
        background: linear-gradient(180deg, rgba(10, 17, 34, 0), rgba(10, 17, 34, 0.92));
        pointer-events: none;
      }
      #unity-footer > * { pointer-events: auto; }
      #unity-build-title { flex: 1; opacity: 0.85; }
      #unity-fullscreen-button {
        width: 34px; height: 34px; cursor: pointer; flex: 0 0 auto;
        border: 2px solid var(--gold); border-radius: 6px;
        background: no-repeat center/16px 16px
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23E8A33D' stroke-width='2.4'><path d='M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5'/></svg>");
      }
      #unity-fullscreen-button:hover { background-color: rgba(232, 163, 61, 0.18); }
      #explora-credit { opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-logo-title">Cali Ciudad Salsera</div>
        <div id="unity-logo-subtitle">Explora Cali: un recorrido multimedia</div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
        <div id="unity-loading-hint">Cargando la novela visual…</div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-build-title">Cali Ciudad Salsera</div>
        <div id="explora-credit">Prototipo académico · Proyecto 2 ASM</div>
        <div id="unity-fullscreen-button" title="Pantalla completa"></div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #C1440E; color: #F4E7D3; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #E8A33D; color: #101820; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/CaliCiudadSalsera.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/CaliCiudadSalsera.data.unityweb",
        frameworkUrl: buildUrl + "/CaliCiudadSalsera.framework.js.unityweb",
        codeUrl: buildUrl + "/CaliCiudadSalsera.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Proyecto ASM - Sistemas Multimedia",
        productName: "Cali Ciudad Salsera",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        // Menos resolucion en moviles: la novela visual no necesita alta densidad.
        config.devicePixelRatio = 1;
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
